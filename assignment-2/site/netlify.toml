# Static site: no build step, publish the folder as-is.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Make the tokenizer link download instead of rendering inline in the browser,
# so the submission "download Tokenizer.json" link works with a single click.
[[headers]]
  for = "/tokenizer.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Content-Disposition = "attachment; filename=\"tokenizer.json\""
